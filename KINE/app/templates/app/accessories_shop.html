{% extends 'app/base.html' %}
{% block title %}Accessories{% endblock %}

{% block content %}

<style>

.container {
    max-width: 100%;
    margin: 0 auto;
    padding: 2px;
    margin-top: 100px;
    margin-bottom: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 5px;
}

.card {
    background-color: #fff;
    overflow: hidden;
}

.product-image {
    width: 100%;
    height: 360px;
    object-fit: cover;
}

.info {
    padding: 2px;
}

.product-title {
    font-size: 1.1rem;
    font-weight: 600;
}

.price {
    font-size: 1.1rem;
    font-weight: bold;
}

/* MOBILE */
@media screen and (max-width: 480px) {
    .product-image { height: 220px; }
    .product-title { font-size: .80rem; }
    .price { font-size: .9rem; }
}
</style>



<div class="container">

    <h2 style="margin-bottom: 20px;">Accessories</h2>

    <div class="grid">
        {% for product in products %}
        <div class="card">
            <a href="{% url 'product_detail' product.id %}">
                <img src="{{ product.image_url }}" class="product-image">
            </a>
            <div class="info">
                <h3 class="product-title">{{ product.name }}</h3>
                <p class="price">₹ {{ product.price }}</p>
            </div>
        </div>
        {% endfor %}
    </div>

</div>

{% endblock %}
