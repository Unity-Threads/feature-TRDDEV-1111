{% extends 'profile/base.html' %}
{% load static %}
{% block content %}

<style>
/* ===== General Layout ===== */
body {
  font-family: "Segoe UI", Roboto, sans-serif;
  background-color: #f7f9fb;
}

/* ===== Profile Container ===== */
.profile-container {
  max-width: 900px;
  margin: 15px auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  padding: 10px;
}

//* ===== Avatar Section with Pencil Icon ===== */
.avatar-section {
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

.avatar-wrapper {
  position: relative;
  width: 150px;
  height: 150px;
}

.avatar-wrapper img {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #070707ff;
  box-shadow: 0 4px 15px rgba(241, 244, 247, 1);
}

/* ✏️ Pencil Icon Overlay */
.edit-avatar-icon {
  position: absolute;
  bottom: 6px;
  right: 6px;
  background: #838181ff;
  color: white;
  border-radius: 50%;
  padding: 8px;
  cursor: pointer;
  transition: background 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}
.edit-avatar-icon:hover {
  background: #0d0d0eff;
}
.edit-avatar-icon i {
  font-size: 14px;
}

/* ===== Profile Details Card ===== */
.profile-details {
  background: white;
  border-radius: 14px;
  padding: 30px 35px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.1);
  width: 360px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.profile-details:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}
.profile-details label {
  display: block;
  font-weight: 600;
  color: #0c0c0cff;
  margin-top: 10px;
  margin-bottom: 5px;
}
.profile-details input {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 14px;
  background-color: #f8f9fa;
  color: #0a0a0aff;
  transition: border-color 0.3s;
}
.profile-details input:focus {
  border-color: #0c0b0bff;
  outline: none;
  background-color: #fff;
}
.profile-details p {
  font-size: 14px;
  color: #0c0b0bff;
  margin-top: 10px;
}

.profile-details button {
  width: 100%;
  padding: 10px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.3s, transform 0.1s;
}
#edit-btn {
  background: linear-gradient(90deg, #141414ff, #080808ff);
  color: white;
}
#edit-btn:hover {
  background: linear-gradient(90deg, #0f0f0fff, #141414ff);
}
#save-btn {
  background: linear-gradient(90deg, #141414ffrgba(7, 7, 7, 1)57);
  color: white;
}
#save-btn:hover {
  background: linear-gradient(90deg, #111111ff, #0f0f0fff);
}
#password-btn {
  background: linear-gradient(90deg, #080808ff, #0f0f0fff);
  color: white;
}
#password-btn:hover {
  background: linear-gradient(90deg, #0f0f0fff, #0e0d0dff);
}
#profile-error {
  color: #dc3545;
  margin-top: 10px;
}
#profile-success {
  color: #14a108ef;
  margin-top: 10px;
}

/* ===== Password Modal Styling (unchanged, gradient bar included) ===== */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.5);
}
.modal-content {
  background-color: #fff;
  margin: 8% auto;
  padding: 30px;
  border-radius: 16px;
  width: 420px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.2);
  text-align: center;
  position: relative;
  animation: fadeIn 0.3s ease-in-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-15px); }
  to { opacity: 1; transform: translateY(0); }
}
.close {
  position: absolute;
  top: 10px;
  right: 15px;
  color: #999;
  font-size: 24px;
  cursor: pointer;
}
.close:hover { color: #333; }

.modal-content input[type="password"] {
  width: 85%;
  padding: 20px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 14px;
}
button {
  background: linear-gradient(90deg, #111111ff, #0d0d0eff);
  color: white;
  border: none;
  padding: 10px 20px;
  margin-top: 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.3s;
}
button:hover { background: linear-gradient(90deg, #0f0f0fff, #0d0d0eff); }

#password-strength {
  height: 8px;
  width: 85%;
  margin: 6px auto;
  border-radius: 5px;
  background-color: #e0e0e0;
  overflow: hidden;
}
#password-strength-bar {
  height: 100%;
  width: 0%;
  border-radius: 5px;
  background: linear-gradient(90deg, red, orange, yellow, green);
  transition: width 0.5s ease, background 0.5s ease;
}
.strength-text {
  font-size: 13px;
  font-weight: 600;
  margin-top: 5px;
  color: #444;
}
/* === Password Field + Eye Icon Styling === */
.password-field {
  position: relative;
  width: 85%;
  margin: 8px auto;
}

.password-field input {
  width: 100%;
  padding: 10px 38px 10px 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
  outline: none;
  transition: border 0.3s ease;
}

.password-field input:focus {
  border-color: #007bff;
}

.toggle-password {
  position: absolute;
  top: 50%;
  right: 10px;
  transform: translateY(-50%);
  color: #888;
  font-size: 16px;
  cursor: pointer;
  transition: color 0.3s ease;
}

.toggle-password.active {
  color: #007bff;
}

.toggle-password:hover {
  color: #007bff;
}


</style>

<div class="profile-container">
  <div class="avatar-section">
  <div class="avatar-wrapper">
    {% if profile.avatar %}
      <img id="avatar-img" src="{{ profile.avatar.url }}" alt="Avatar">
    {% else %}
      <img id="avatar-img" src="{% static 'base/images/default-avatar.png' %}" alt="Default Avatar">
    {% endif %}
    <!-- ✏️ Pencil Icon Overlay -->
    <label for="avatar-input" class="edit-avatar-icon">
      <i class="fa fa-pencil"></i>
    </label>
    <input type="file" id="avatar-input" name="avatar" hidden>
  </div>
</div>


  <div class="profile-details">
    <label>Name:</label>
    <input type="text" id="name" value="{{ request.user.first_name }}" disabled>

    <label>Email:</label>
    <input type="email" id="email" value="{{ request.user.email }}" disabled>

    <p><strong>Phone:</strong> {{ profile.phone_number }}</p>

    <button id="edit-btn">Edit Profile</button>
    <button id="save-btn" style="display:none;">Save Changes</button>
    <button id="password-btn">Change Password</button>

    <p id="profile-error"></p>
    <p id="profile-success"></p>
  </div>
</div>


<!-- Password Modal -->
<div id="passwordModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h3 style="margin-bottom: 15px;">Change Password</h3>

    <form id="passwordForm">
      {% csrf_token %}
      
    <div class="password-field">
  <input type="password" name="old_password" id="old_password" placeholder="Old Password" required>
  <i class="fa fa-eye toggle-password" data-target="old_password" title="Show Password"></i>
</div>

<div class="password-field">
  <input type="password" name="new_password1" id="new_password1" placeholder="New Password" required>
  <i class="fa fa-eye toggle-password" data-target="new_password1" title="Show Password"></i>
</div>

<div id="password-strength">
  <div id="password-strength-bar"></div>
</div>
<div class="strength-text" id="strength-text"></div>

<div class="password-field">
  <input type="password" name="new_password2" id="new_password2" placeholder="Confirm New Password" required>
  <i class="fa fa-eye toggle-password" data-target="new_password2" title="Show Password"></i>
</div>


      <button type="submit">Change Password</button>
    </form>

    <p id="password-error" style="color: red; margin-top:10px;"></p>
    <p id="password-success" style="color: green; margin-top:10px;"></p>
  </div>
</div>

{% endblock %}
