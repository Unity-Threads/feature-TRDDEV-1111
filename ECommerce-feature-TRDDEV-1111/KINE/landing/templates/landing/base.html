{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Shop{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'landing/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'landing/js/script.js' %}">
    <link rel="stylesheet" href="{% static 'landing/css/header.css' %}">
    <link rel="stylesheet" href="{% static 'landing/css/footer.css' %}">
    <link rel="stylesheet" href="{% static 'landing/css/landing.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

</head>
<body>

    <!-- ===== HEADER ===== -->
    {% include 'landing/header.html' %}

    <!-- ===== MAIN CONTENT ===== -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- ===== FOOTER ===== -->
    {% include 'landing/footer.html' %}

</body>
</html>
